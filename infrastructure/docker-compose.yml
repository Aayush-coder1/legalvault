
services:
  api-gateway:
    build: ../services/api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      AUTH_URL: http://auth-service:4001
      CASE_URL: http://case-service:4002
      FILE_URL: http://file-service:4003
      CRYPTO_URL: http://crypto-proxy:4004
    depends_on:
      - auth-service
      - case-service
      - file-service
      - crypto-proxy
    networks:
      - legalvault-network

  auth-service:
    build: ../services/auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ../.env
    networks:
      - legalvault-network

  crypto-proxy:
    build: ../services/crypto-proxy
    restart: unless-stopped
    ports:
      - "4004:4004"
    env_file:
      - ../.env
    depends_on:
      - auth-service
    networks:
      - legalvault-network

  case-service:
    build: ../services/case-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - ../.env
    depends_on:
      - crypto-proxy
      - auth-service
    networks:
      - legalvault-network

  file-service:
    build: ../services/file-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    env_file:
      - ../.env
    depends_on:
      - crypto-proxy
      - auth-service
    networks:
      - legalvault-network

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
        NEXT_PUBLIC_AUTH_URL: http://localhost:4000
        NEXT_PUBLIC_CASE_URL: http://localhost:4000
        NEXT_PUBLIC_FILE_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - legalvault-network

networks:
  legalvault-network:
    driver: bridge
