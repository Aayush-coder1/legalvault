services:
  auth-service:
    build: ../services/auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  crypto-proxy:
    build: ../services/crypto-proxy
    restart: unless-stopped
    ports:
      - "4004:4004"
    env_file:
      - ../.env
    depends_on:
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  case-service:
    build: ../services/case-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - ../.env
    depends_on:
      crypto-proxy:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  file-service:
    build: ../services/file-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    env_file:
      - ../.env
    depends_on:
      crypto-proxy:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_AUTH_URL: http://localhost:4001
        NEXT_PUBLIC_CASE_URL: http://localhost:4002
        NEXT_PUBLIC_FILE_URL: http://localhost:4003
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - case-service
      - file-service
