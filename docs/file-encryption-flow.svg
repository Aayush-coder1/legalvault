<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1220" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img">
<title>LegalVault — Encrypted File Storage Flow</title>
<defs>
  <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#334155"/>
  </marker>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
  </marker>
  <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#0284C7"/>
  </marker>
  <filter id="fs" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
</defs>

<rect width="1400" height="1220" fill="#FFFFFF"/>
<text x="700" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">LegalVault — Encrypted File Storage Flow</text>
<text x="700" y="68" text-anchor="middle" font-size="13" fill="#64748B">Upload: plaintext → per-file envelope encryption → ciphertext in B2 • Download: exact reverse, tags verified</text>

<!-- ============ UPLOAD PIPELINE ============ -->
<text x="60" y="108" font-size="13" font-weight="800" fill="#0F172A">UPLOAD (any type: image • video • pdf — same locked path, max 25 MB)</text>

<g filter="url(#fs)">
  <rect x="60" y="120" width="200" height="104" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="160" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#1E3A8A">1 • Browser</text>
  <text x="160" y="173" text-anchor="middle" font-size="12" fill="#475569">Frontend :3000</text>
  <text x="160" y="193" text-anchor="middle" font-size="12" fill="#475569">file → base64</text>
</g>
<g filter="url(#fs)">
  <rect x="310" y="120" width="200" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="410" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#92400E">2 • Gateway</text>
  <text x="410" y="173" text-anchor="middle" font-size="12" fill="#475569">:4000 • POST /files</text>
  <text x="410" y="193" text-anchor="middle" font-size="12" fill="#475569">forwards + auth</text>
</g>
<g filter="url(#fs)">
  <rect x="560" y="120" width="200" height="104" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2.5"/>
  <text x="660" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#115E59">3 • File Server</text>
  <text x="660" y="173" text-anchor="middle" font-size="12" fill="#475569">:4003 • validate</text>
  <text x="660" y="193" text-anchor="middle" font-size="12" fill="#475569">size + tenant check</text>
</g>
<g filter="url(#fs)">
  <rect x="810" y="120" width="200" height="104" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="910" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#991B1B">4 • Crypto-Proxy</text>
  <text x="910" y="173" text-anchor="middle" font-size="12" fill="#475569">:4004 • lockBuffer()</text>
  <text x="910" y="193" text-anchor="middle" font-size="12" fill="#475569">sha256 + encrypt</text>
</g>
<g filter="url(#fs)">
  <rect x="1060" y="120" width="280" height="104" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
  <path d="M1090 142 h46 l-5 40 h-36 z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="1113" cy="142" rx="23" ry="5" fill="none" stroke="#0284C7" stroke-width="2"/>
  <text x="1230" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#0C4A6E">5 • Stores</text>
  <text x="1230" y="173" text-anchor="middle" font-size="12" fill="#475569">B2: ciphertext bytes</text>
  <text x="1230" y="193" text-anchor="middle" font-size="12" fill="#475569">Mongo: FileMeta row</text>
</g>

<line x1="260" y1="172" x2="305" y2="172" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
<line x1="510" y1="172" x2="555" y2="172" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
<line x1="760" y1="172" x2="805" y2="172" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
<line x1="1010" y1="172" x2="1055" y2="172" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>

<!-- ============ ENVELOPE DETAIL ============ -->
<text x="60" y="268" font-size="13" font-weight="800" fill="#0F172A">ENVELOPE ENCRYPTION inside crypto-proxy (AES-256-GCM everywhere)</text>
<g filter="url(#fs)">
  <rect x="60" y="280" width="620" height="150" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="370" y="308" text-anchor="middle" font-size="14" font-weight="800" fill="#991B1B">File bytes → locked with a fresh random DEK</text>
  <text x="370" y="332" text-anchor="middle" font-size="12.5" fill="#475569">random 32-byte DEK per file • random 12-byte IV per file</text>
  <rect x="90" y="348" width="560" height="58" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">ciphertext + iv + auth tag  →  PUT to B2 only</text>
  <text x="370" y="392" text-anchor="middle" font-size="11.5" fill="#64748B">B2 never sees plaintext or any key</text>
</g>
<g filter="url(#fs)">
  <rect x="720" y="280" width="620" height="150" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1030" y="308" text-anchor="middle" font-size="14" font-weight="800" fill="#4C1D95">DEK → locked with the tenant key</text>
  <text x="1030" y="332" text-anchor="middle" font-size="12.5" fill="#475569">tenant key unwrapped from TenantKey row (this file's version)</text>
  <rect x="750" y="348" width="560" height="58" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1030" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">encDek + dekIv + dekTag  →  Mongo encBundle</text>
  <text x="1030" y="392" text-anchor="middle" font-size="11.5" fill="#64748B">raw DEK + plaintext buffer zeroed from memory</text>
</g>

<!-- ============ KEY HIERARCHY ============ -->
<text x="60" y="474" font-size="13" font-weight="800" fill="#0F172A">KEY HIERARCHY (each layer unlocks only the next)</text>
<g filter="url(#fs)">
  <rect x="60" y="486" width="300" height="96" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <text x="210" y="516" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">Master key</text>
  <text x="210" y="537" text-anchor="middle" font-size="12" fill="#475569">env CRYPTO_MASTER_KEY</text>
  <text x="210" y="556" text-anchor="middle" font-size="12" fill="#475569">32 bytes, never in DB</text>
</g>
<g filter="url(#fs)">
  <rect x="410" y="486" width="330" height="96" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="575" y="516" text-anchor="middle" font-size="14" font-weight="800" fill="#4C1D95">Tenant key (versioned)</text>
  <text x="575" y="537" text-anchor="middle" font-size="12" fill="#475569">Mongo TenantKey, wrapped</text>
  <text x="575" y="556" text-anchor="middle" font-size="12" fill="#475569">old versions kept readable</text>
</g>
<g filter="url(#fs)">
  <rect x="790" y="486" width="270" height="96" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="925" y="516" text-anchor="middle" font-size="14" font-weight="800" fill="#991B1B">Per-file DEK</text>
  <text x="925" y="537" text-anchor="middle" font-size="12" fill="#475569">random per file</text>
  <text x="925" y="556" text-anchor="middle" font-size="12" fill="#475569">locked, then wiped</text>
</g>
<g filter="url(#fs)">
  <rect x="1110" y="486" width="230" height="96" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="1225" y="516" text-anchor="middle" font-size="14" font-weight="800" fill="#0C4A6E">File bytes</text>
  <text x="1225" y="537" text-anchor="middle" font-size="12" fill="#475569">image • video • pdf</text>
  <text x="1225" y="556" text-anchor="middle" font-size="12" fill="#475569">ciphertext in B2</text>
</g>
<line x1="360" y1="534" x2="405" y2="534" stroke="#DC2626" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="382" y="524" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">wraps</text>
<line x1="740" y1="534" x2="785" y2="534" stroke="#DC2626" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="762" y="524" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">locks</text>
<line x1="1060" y1="534" x2="1105" y2="534" stroke="#DC2626" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="1082" y="524" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">encrypts</text>

<!-- ============ WHAT LIVES WHERE ============ -->
<text x="60" y="626" font-size="13" font-weight="800" fill="#0F172A">WHAT LIVES WHERE (ciphertext split across two systems)</text>
<g filter="url(#fs)">
  <ellipse cx="370" cy="668" rx="150" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <rect x="220" y="668" width="300" height="150" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="220" y1="668" x2="220" y2="818" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="520" y1="668" x2="520" y2="818" stroke="#16A34A" stroke-width="2.5"/>
  <ellipse cx="370" cy="818" rx="150" ry="24" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5"/>
  <ellipse cx="370" cy="668" rx="150" ry="24" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="370" y="722" text-anchor="middle" font-size="15" font-weight="800" fill="#14532D">MongoDB — FileMeta</text>
  <text x="370" y="743" text-anchor="middle" font-size="11.5" fill="#475569">fileName • mimeType • size</text>
  <text x="370" y="761" text-anchor="middle" font-size="11.5" fill="#475569">sha256 • s3Key • keyVersion</text>
  <text x="370" y="779" text-anchor="middle" font-size="11.5" fill="#475569">encBundle (NO ciphertext)</text>
  <text x="370" y="797" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532D">metadata only — useless alone</text>
</g>
<g filter="url(#fs)">
  <rect x="580" y="652" width="360" height="182" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
  <path d="M610 674 h64 l-7 54 h-50 z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="642" cy="674" rx="32" ry="7" fill="none" stroke="#0284C7" stroke-width="2"/>
  <text x="800" y="700" text-anchor="middle" font-size="15" font-weight="800" fill="#0C4A6E">Backblaze B2 — private</text>
  <text x="800" y="722" text-anchor="middle" font-size="11.5" fill="#475569">key: tenantId/caseId/fileId</text>
  <text x="800" y="740" text-anchor="middle" font-size="11.5" fill="#475569">opaque ciphertext bytes</text>
  <text x="800" y="758" text-anchor="middle" font-size="11.5" fill="#475569">no keys • no filenames</text>
  <text x="800" y="780" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C4A6E">bytes only — useless alone</text>
</g>
<g filter="url(#fs)">
  <rect x="1000" y="652" width="340" height="182" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1170" y="690" text-anchor="middle" font-size="15" font-weight="800" fill="#0F172A">Never stored</text>
  <text x="1170" y="714" text-anchor="middle" font-size="11.5" fill="#475569">✕ plaintext file bytes</text>
  <text x="1170" y="734" text-anchor="middle" font-size="11.5" fill="#475569">✕ raw per-file DEK</text>
  <text x="1170" y="754" text-anchor="middle" font-size="11.5" fill="#475569">✕ master key</text>
  <text x="1170" y="778" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F172A">only in memory, then wiped</text>
</g>

<!-- ============ DOWNLOAD ============ -->
<text x="60" y="878" font-size="13" font-weight="800" fill="#0F172A">DOWNLOAD (exact reverse — auth tags verified, tampering rejected with 422)</text>
<g filter="url(#fs)">
  <rect x="60" y="890" width="190" height="96" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="155" y="920" text-anchor="middle" font-size="14" font-weight="800" fill="#1E3A8A">Browser</text>
  <text x="155" y="941" text-anchor="middle" font-size="12" fill="#475569">GET /files/:id</text>
  <text x="155" y="960" text-anchor="middle" font-size="12" fill="#475569">receives plaintext</text>
</g>
<g filter="url(#fs)">
  <rect x="300" y="890" width="190" height="96" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="395" y="920" text-anchor="middle" font-size="14" font-weight="800" fill="#92400E">Gateway :4000</text>
  <text x="395" y="941" text-anchor="middle" font-size="12" fill="#475569">proxies + auth</text>
  <text x="395" y="960" text-anchor="middle" font-size="12" fill="#475569">streams bytes back</text>
</g>
<g filter="url(#fs)">
  <rect x="540" y="890" width="220" height="96" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="920" text-anchor="middle" font-size="14" font-weight="800" fill="#991B1B">Crypto-Proxy</text>
  <text x="650" y="941" text-anchor="middle" font-size="12" fill="#475569">meta + keyVersion → key</text>
  <text x="650" y="960" text-anchor="middle" font-size="12" fill="#475569">unlockBuffer() + verify</text>
</g>
<g filter="url(#fs)">
  <rect x="810" y="890" width="250" height="96" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="935" y="920" text-anchor="middle" font-size="14" font-weight="800" fill="#14532D">Mongo + B2 fetch</text>
  <text x="935" y="941" text-anchor="middle" font-size="12" fill="#475569">encBundle ← FileMeta</text>
  <text x="935" y="960" text-anchor="middle" font-size="12" fill="#475569">ciphertext ← B2 object</text>
</g>
<g filter="url(#fs)">
  <rect x="1110" y="890" width="230" height="96" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <text x="1225" y="920" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">Guards</text>
  <text x="1225" y="941" text-anchor="middle" font-size="12" fill="#475569">tenant match • 404</text>
  <text x="1225" y="960" text-anchor="middle" font-size="12" fill="#475569">tag fail → 422</text>
</g>
<line x1="1060" y1="938" x2="1105" y2="938" stroke="#0284C7" stroke-width="2.2" marker-end="url(#fd)"/>
<line x1="760" y1="938" x2="805" y2="938" stroke="#0284C7" stroke-width="2.2" marker-end="url(#fd)"/>
<line x1="490" y1="938" x2="535" y2="938" stroke="#0284C7" stroke-width="2.2" marker-end="url(#fd)"/>
<line x1="250" y1="938" x2="295" y2="938" stroke="#0284C7" stroke-width="2.2" marker-end="url(#fd)"/>
<text x="1082" y="928" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284C7">check</text>
<text x="782" y="928" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284C7">rejoin</text>
<text x="512" y="928" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284C7">decrypt</text>
<text x="272" y="928" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284C7">plain</text>

<!-- Safety notes -->
<g filter="url(#fs)">
  <rect x="60" y="1020" width="1280" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="90" y="1050" font-size="13" font-weight="800" fill="#92400E">Reliability + honesty notes (straight from the code)</text>
  <text x="90" y="1072" font-size="12" fill="#475569">• Orphan guard: if the Mongo write fails after the B2 PUT, the S3 object is deleted (compensating rollback) — crypto.controller.js:230-233.</text>
  <text x="90" y="1092" font-size="12" fill="#475569">• Plaintext in metadata: fileName, mimeType and sizeBytes stay readable in FileMeta for listing — only file contents are encrypted.</text>
  <text x="90" y="1112" font-size="12" fill="#475569">• Keep the B2 bucket private anyway: blobs are opaque, but object sizes and timestamps alone can leak activity patterns.</text>
</g>

<!-- Legend -->
<g font-size="11.5" fill="#64748B">
  <line x1="60" y1="1175" x2="100" y2="1175" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <text x="108" y="1179">upload step</text>
  <line x1="230" y1="1175" x2="270" y2="1175" stroke="#0284C7" stroke-width="2.2" marker-end="url(#fd)"/>
  <text x="278" y="1179">download step</text>
  <line x1="420" y1="1175" x2="460" y2="1175" stroke="#DC2626" stroke-width="2.2" marker-end="url(#fl)"/>
  <text x="468" y="1179">key wraps / encrypts</text>
  <rect x="640" y="1165" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="662" y="1178">ciphertext boundary</text>
  <rect x="830" y="1165" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="852" y="1178">never stored</text>
</g>

</svg>
