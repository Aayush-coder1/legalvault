# Render Blueprint — LegalVault (5 backends + Next.js frontend)
# Deploy: push this file at repo root, then Render Dashboard → New → Blueprint → select repo.
# Secrets are NOT in this file — add them manually per service in the Dashboard
# (Environment tab). What stays here is only build/start commands plus
# non-secret wiring (ports, internal URLs, JWT labels).
# NOTE: Render forces PORT=10000 on every service at runtime (it overrides the
# PORT values below — see deploy logs "on :10000"). So internal service-to-
# service URLs MUST use :10000, not the local-dev ports (4000-4004).
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------- auth-service :4001 ----------
  # MANUAL SECRETS: MONGO_URI, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY
  - type: web
    name: legalvault-auth
    runtime: node
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: AUTH_PORT
        value: "4001"
      - key: JWT_KID
        value: legalvault-1
      - key: JWT_ISSUER
        value: legalvault-auth
      - key: JWT_AUDIENCE
        value: legalvault-app
      - key: ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legalvault-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- crypto-proxy :4004 ----------
  # MANUAL SECRETS: MONGO_URI, CRYPTO_MASTER_KEY, B2_ENDPOINT, B2_KEY_ID, B2_APP_KEY, B2_BUCKET
  - type: web # change to `pserv` (private) on a paid plan to hide it from the internet
    name: legalvault-crypto
    runtime: node
    rootDir: services/crypto-proxy
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4004"
      - key: CRYPTO_PORT
        value: "4004"
      - key: JWKS_URL
        value: http://legalvault-auth:10000/auth/jwks.json # private-network URL
      - key: JWT_ISSUER
        value: legalvault-auth
      - key: JWT_AUDIENCE
        value: legalvault-app
      - key: B2_REGION
        value: us-east-1
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legalvault-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- case-service :4002 ----------
  # MANUAL SECRETS: none required (MONGO_URI optional — uses crypto-proxy for storage)
  - type: web
    name: legalvault-case
    runtime: node
    rootDir: services/case-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4002"
      - key: CASE_PORT
        value: "4002"
      - key: JWKS_URL
        value: http://legalvault-auth:10000/auth/jwks.json
      - key: JWT_ISSUER
        value: legalvault-auth
      - key: JWT_AUDIENCE
        value: legalvault-app
      - key: CRYPTO_PROXY_URL
        value: http://legalvault-crypto:10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legalvault-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- file-service :4003 ----------
  # MANUAL SECRETS: none required (storage secrets live in crypto-proxy)
  - type: web
    name: legalvault-file
    runtime: node
    rootDir: services/file-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4003"
      - key: FILE_PORT
        value: "4003"
      - key: JWKS_URL
        value: http://legalvault-auth:10000/auth/jwks.json
      - key: JWT_ISSUER
        value: legalvault-auth
      - key: JWT_AUDIENCE
        value: legalvault-app
      - key: CRYPTO_PROXY_URL
        value: http://legalvault-crypto:10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legalvault-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- api-gateway :4000 (single public entry point for the frontend) ----------
  # MANUAL SECRETS: none required
  - type: web
    name: legalvault-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: GATEWAY_PORT
        value: "4000"
      - key: AUTH_URL
        value: http://legalvault-auth:10000
      - key: CASE_URL
        value: http://legalvault-case:10000
      - key: FILE_URL
        value: http://legalvault-file:10000
      - key: GATEWAY_TIMEOUT_MS
        value: "30000"
      - key: GATEWAY_BODY_LIMIT_MB
        value: "30"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legalvault-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- frontend :3000 (Next.js — talks ONLY to the gateway's public URL) ----------
  # MANUAL SECRETS: none required
  - type: web
    name: legalvault-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # All four point at the gateway (it fans out to auth/case/file).
      # Sourced from the gateway's external URL so no hardcoding is needed.
      - key: NEXT_PUBLIC_GATEWAY_URL
        fromService:
          type: web
          name: legalvault-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_AUTH_URL
        fromService:
          type: web
          name: legalvault-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_CASE_URL
        fromService:
          type: web
          name: legalvault-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_FILE_URL
        fromService:
          type: web
          name: legalvault-gateway
          envVarKey: RENDER_EXTERNAL_URL
